name: Build & Deploy Solana Program to Devnet

on:
  workflow_dispatch:
  push:
    paths:
      - 'programs/**'
      - 'Cargo.toml'
      - '.github/workflows/solana-deploy.yml'

env:
  SOLANA_CLI_VERSION: "1.18.18"
  ANCHOR_VERSION: "0.30.1"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.79.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_CLI_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Configure Solana for Devnet
        run: |
          solana config set --url https://api.devnet.solana.com

      - name: Setup Deploy Keypair
        run: |
          echo "${{ secrets.SOLANA_DEPLOYER_KEYPAIR }}" > /tmp/deployer.json
          solana config set --keypair /tmp/deployer.json
          echo "Deployer address: $(solana address)"
          echo "Balance:"
          solana balance || echo "Could not fetch balance"

      - name: Build Program (cargo build-sbf)
        run: |
          cargo build-sbf --manifest-path programs/prediction-attestation/Cargo.toml

      - name: Deploy to Devnet
        run: |
          echo "Requesting airdrop for deployment fees..."
          solana airdrop 2 || echo "Airdrop failed (may already have SOL)"
          sleep 5
          solana airdrop 2 || true
          sleep 5
          echo "Deploying program..."
          solana program deploy \
            target/deploy/prediction_attestation.so \
            --program-id target/deploy/prediction_attestation-keypair.json \
            --url https://api.devnet.solana.com \
            -v

      - name: Show Program Info
        run: |
          PROGRAM_ID=$(solana-keygen pubkey target/deploy/prediction_attestation-keypair.json 2>/dev/null || echo "unknown")
          echo "✅ Program deployed to devnet!"
          echo "Program ID: $PROGRAM_ID"
          echo "Explorer: https://explorer.solana.com/address/$PROGRAM_ID?cluster=devnet"
